# Build the yogi kernel and publish a release. Manually triggered: releases are a
# decision, not something every push should produce, and main3 is an order of magnitude
# faster for iterating. What CI buys is that the artifact strangers flash was built from
# exactly what is pushed, by something other than one laptop.
name: release

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: heybooboo-kernel ref to build
        default: ksunext-susfs
      release_tag:
        description: tag to publish under (leave blank to build and attach artifacts only)
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MANIFEST: https://android.googlesource.com/kernel/manifest
      BRANCH: common-android16-6.12
      KREPO: asdfmonster261/heybooboo-kernel

    steps:
      - name: Check out the build tooling
        uses: actions/checkout@v4

      # Headroom, not necessity: measured peak was 59 GB of the runner's 145 GB, so the
      # tree fits without this. Kept because bazel's output grows and an LTO build would
      # need far more, and it costs a minute. Done inline rather than with a cleanup
      # action because this job publishes images people flash, so each third-party
      # action is trust extended for very little.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get -qq update && sudo apt-get -qq install -y xz-utils bzip2

      # repo's local_manifests is how our kernel replaces ACK's common at the same path,
      # which is what the bind mount does on main3. clone-depth matters: heybooboo-kernel
      # carries ACK's full 1.34M-commit history and CI wants none of it.
      - name: Sync the ACK tree with our kernel in place of common
        run: |
          mkdir -p gki && cd gki
          git config --global user.email ci@example.com
          git config --global user.name ci
          repo init -u "$MANIFEST" -b "$BRANCH" --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/heybooboo.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="hb" fetch="https://github.com/" />
            <remove-project name="kernel/common" />
            <project path="common" name="${KREPO}" remote="hb"
                     revision="${{ inputs.kernel_ref }}" clone-depth="1" />
          </manifest>
          XML
          repo sync -c -j"$(nproc)" --no-clone-bundle --optimized-fetch --prune --fail-fast
          df -h / | tail -1

      # Without this the artifacts stamp -maybe-dirty and a 1970 build date: kleaf's
      # non-stamp branch hardcodes both, and its own git fallback is dead because the
      # source is a shallow checkout. --short=12 is explicit rather than relying on
      # git's object-count heuristic, which differs on a shallow clone.
      - name: Stamp scmversion and build date
        working-directory: gki
        run: |
          SHORT=$(git -C common rev-parse --short=12 HEAD)
          SDE=$(git -C common log -1 --pretty=%ct HEAD)
          echo "KVER_SCM=$SHORT" >> "$GITHUB_ENV"
          sed -i -E "/stable_scmversion_cmd = \"echo/ s/'.*'/'-heybooboo-g$SHORT'/" \
            build/kernel/kleaf/impl/stamp.bzl
          sed -i -E "s/export SOURCE_DATE_EPOCH=[0-9]+/export SOURCE_DATE_EPOCH=$SDE/" \
            build/kernel/kleaf/impl/stamp.bzl
          sed -i 's/date -d @/date -u -d @/' build/kernel/_setup_env.sh
          grep -q "echo '-heybooboo-g$SHORT'" build/kernel/kleaf/impl/stamp.bzl
          grep -q "export SOURCE_DATE_EPOCH=$SDE" build/kernel/kleaf/impl/stamp.bzl

      # Deliberately uncached. kleaf runs the whole kernel compile inside ONE bazel
      # action, so a --disk_cache entry is keyed on that action's inputs, and a release
      # is by definition a new commit: it would miss every time. Measured 1290 s with a
      # 1256 s critical path, so it is one serial chain rather than a parallelism
      # problem, and more cores would not move it much either. Caching the ~6 min sync
      # instead would need release-asset chunking to beat the 10 GB cache limit, which
      # is a lot of machinery for six minutes.
      - name: Build the GKI kernel
        working-directory: gki
        run: tools/bazel build //common:kernel_aarch64_gki_artifacts

      # stgdiff exits 4 on drift, which is the normal state here and not a build
      # failure, so the verdict comes from check-abi.sh comparing the report against
      # the breaks we have already approved.
      - name: Check the ABI against the approved breaks
        working-directory: gki
        run: |
          tools/bazel run //common:kernel_aarch64_abi_diff || true
          d=bazel-bin/common/kernel_aarch64_abi_diff
          echo "stgdiff exit: $(cat "$d/exit_code_file.txt" 2>/dev/null)"
          "$GITHUB_WORKSPACE/scripts/check-abi.sh" check "$d/abi_stgdiff/abi.report.small"

      # release.sh fetches a current stock boot from Google's OTA, gates the repack
      # against it, and emits the zip plus an image named for that patch level. It
      # refuses to publish an unsigned image, so the raw kleaf boot.img (which carries a
      # placeholder security_patch of 2027-00-05) cannot leak into a release.
      - name: Package
        run: |
          mkdir -p out
          REL=$(strings gki/bazel-bin/common/kernel_aarch64/vmlinux \
                | grep -m1 -oE '6\.[0-9]+\.[0-9]+-android[0-9]+-[0-9]+')
          [ -n "$REL" ] || { echo "no kernel release string in vmlinux" >&2; exit 1; }
          NAME="heybooboo-${REL%%-android*}-g${KVER_SCM}"
          echo "REL_NAME=$NAME" >> "$GITHUB_ENV"
          scripts/release.sh gki/bazel-bin/common/kernel_aarch64_gki_artifacts/boot.img \
            "out/${NAME}.zip"
          ls -l out/

      - name: Collect the patch level for the notes
        run: |
          img=$(ls out/*-spl*.img)
          spl=$(basename "$img" | sed -E 's/.*-spl([0-9-]+)\.img/\1/')
          echo "REL_SPL=$spl" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REL_NAME }}
          path: out/*
          if-no-files-found: error

      - name: Publish
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<MD
          Kernel \`${REL_NAME}\` for the Pixel 11 Pro Fold (yogi).

          Built from \`${{ inputs.kernel_ref }}\` at \`${KVER_SCM}\`, gated against
          stock security patch level **${REL_SPL}**.

          | file | use |
          |---|---|
          | \`${REL_NAME}.zip\` | Flash in OrangeFox or KernelFlasher. Repacks the kernel into your own boot image, so it works on **any** security patch level. |
          | \`${REL_NAME}-spl${REL_SPL}.img\` | \`fastboot flash boot\`, for a first install with no root or custom recovery yet. Pinned to patch level **${REL_SPL}**: do not flash it on a newer one. |

          vendor_kernel_boot is left stock and must not be flashed.
          MD
          gh release create "${{ inputs.release_tag }}" out/* \
            --title "$REL_NAME" --notes-file notes.md
